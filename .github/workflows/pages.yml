name: GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # allow manual re-runs from the Actions tab

# Allow one concurrent deployment; cancel queued runs but let the running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Sub-path required for GitHub project pages (/<repo-name>/)
          VITE_BASE_PATH: /CarMarket/
          # Optional: point the frontend at a live backend
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # GitHub Pages serves 404.html for unknown paths.
      # Copying index.html there lets React Router handle all deep links.
      - name: Create 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
