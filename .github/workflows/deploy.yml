name: Deploy

on:
  push:
    branches: [main, master]

jobs:
  # ──────────────────────────────────────────────
  # Deploy backend to Render
  # ──────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger Render deploy hook
        # Store your Render deploy hook URL as the secret RENDER_DEPLOY_HOOK_URL
        # (Render Dashboard → Service → Settings → Deploy Hooks → "+ Add Deploy Hook")
        run: |
          curl -sf "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" || { echo "Render deploy hook failed"; exit 1; }

  # ──────────────────────────────────────────────
  # Deploy frontend to Vercel
  # ──────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
